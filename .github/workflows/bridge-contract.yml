name: Bridge contract and secret scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  bridge-tests:
    name: Bridge tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install pytest httpx websockets
      - name: Validate bridge syntax
        run: python -m py_compile agent/universe_bridge.py
      - name: Run bridge contract tests
        run: python -m pytest agent/tests/test_universe_bridge.py -q

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
